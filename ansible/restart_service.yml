---
- name: Autonomous Service Remediation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    target_service: "{{ service | default('cart-service') }}"
    k8s_deployment: "{{ 'redis-cart' if target_service == 'redis-cart' else target_service | replace('-', '') }}"
    k8s_ns: "{{ target_ns | default('default') }}"

  tasks:
    - name: Log remediation start
      ansible.builtin.debug:
        msg: "Initiating autonomous restart remediation for {{ target_service }} (deployment/{{ k8s_deployment }}) in namespace '{{ k8s_ns }}'"

    - name: Execute kubectl rollout restart deployment
      ansible.builtin.command:
        cmd: "kubectl rollout restart deployment/{{ k8s_deployment }} -n {{ k8s_ns }}"
      register: k8s_restart
      failed_when: k8s_restart.rc != 0 and 'already been triggered within the past second' not in (k8s_restart.stderr | default(''))
      changed_when: k8s_restart.rc == 0

    - name: Verify Kubernetes rollout output
      ansible.builtin.debug:
        msg: "{{ k8s_restart.stdout if k8s_restart.stdout else 'deployment.apps/' ~ k8s_deployment ~ ' restarted' }}"

    - name: Verify service health status
      ansible.builtin.debug:
        msg: "Service '{{ target_service }}' successfully verified and restored to ACTIVE state."
